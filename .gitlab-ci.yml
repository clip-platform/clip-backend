stages:
  - build
  - test
  - sonarqube
  - package

variables:
  API_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore DemoApi.sln
    - dotnet build DemoApi.sln -c Release --no-restore

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet test DemoApi.sln --collect:"XPlat Code Coverage" --results-directory ./coverage
  artifacts:
    paths:
      - coverage
    expire_in: 1 hour

sonarqube-check:
  stage: sonarqube
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet tool restore
    - dotnet sonarscanner begin
        /k:"dotnet-api"
        /d:sonar.host.url="$SONAR_HOST_URL"
        /d:sonar.token="$SONAR_TOKEN"
        /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"
    - dotnet build DemoApi.sln -c Release
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

docker-build-push:
  stage: package
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker build -t $API_IMAGE -t $CI_REGISTRY_IMAGE:latest .
    - docker push $API_IMAGE
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
